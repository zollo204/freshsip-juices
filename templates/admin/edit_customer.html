{% extends "base.html" %}

{% block title %}
Edit Customer | FreshSip Admin
{% endblock %}


{% block content %}

<section class="admin-page">

    <div class="container">

        <div class="section-heading">

            <p>
                FRESHSIP ADMIN
            </p>

            <h1>
                Edit Customer
            </h1>

            <span>
                Update customer account information.
            </span>

        </div>


        <div class="admin-form-container">

            <form
                method="POST"
                action="{{ url_for(
                    'admin.edit_customer',
                    user_id=customer.id
                ) }}"
                class="admin-form"
            >

                <div class="form-group">

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        value="{{ customer.name }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="{{ customer.email }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="text"
                        id="phone"
                        name="phone"
                        value="{{ customer.phone }}"
                        required
                    >

                </div>


                <div class="admin-form-actions">

                    <button
                        type="submit"
                        class="btn btn-primary"
                    >
                        Save Changes
                    </button>


                    <a
                        href="{{ url_for('admin.customers') }}"
                        class="btn btn-secondary"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>


        <div class="admin-back-link">

            <a
                href="{{ url_for('admin.customers') }}"
                class="btn btn-secondary"
            >
                ← Back to Customers
            </a>

        </div>

    </div>

</section>

{% endblock %}
